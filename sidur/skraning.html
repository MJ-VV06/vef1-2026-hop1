<!DOCTYPE html>
<html lang="is">
<head>
    <!-- Takk fyrir meta stöffið Marijónas ;) -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skráning</title>


    <!--css-->
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="skraningbody">
    <main>  <!--Þetta er hvert allt fer-->
        <div class="headerdivvv">
            
           <div>
            <img class="skraninglogo" src="../myndir/Logos/CompanyLogoNemaSVG.svg" alt="Firmamerki fyrirtækisins">
           </div>
           <div>
            <h2 class="displayxs">Skráðu þig inn</h2>
            <h5>Velkomin aftur í Forritið.</h5>
           </div>
        </div>
        <div class="skraningcontent"> <!-- Content -->

            
                <form>
                    <div> <!-- Form -->
                        
                        <label for="email">Netfang</label>
                        <input type="email" id="email" name="email" placeholder="Skráðu netfangið þitt"/>
                        <h6>This is a hint text to help user.</h6>
                        
                    </div>
                    <div>
                        
                        <label for="email">Lykilorð</label>
                        <input type="password" id="lykilord" name="lykilord" placeholder="••••••••" class="formm">
                        <h6>This is a hint text to help user.</h6>
                        
                    </div>
                </form>
                <div class="rowrowtwo"> <!-- Row -->
                    <div>
                    <input type="checkbox" id="rememberme" name="rememberme"/>
                    <label>Mundu eftir mér í 30 daga</label>
                    </div>
                    <a href=""><h6>Gleymt lykilorð</h6></a>
                </div>
                <div class="skraningaction"> <!-- Actions -->
                    <button>Innskráning</button>
                    <button class="takki-2"><img src="../myndir/Logos/Google-Icon.svg" alt="Firmamerki Google">     Innskráning með Google</button>
                </div>
            
            
        </div>
        <div class="skraningfinal"> <!-- Row -->
            
        <p>Ekki með aðgang?</p> <a href="">Skráðu þig</a>
  </div>

</main>
</body> <!-- Það verður enginn footer í þessari síður samkvæmt fyrirmælum -->
